name: build-binaries

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: chalkpress-macos-arm64
          - os: windows-latest
            artifact: chalkpress-windows-x64
          - os: ubuntu-22.04
            artifact: chalkpress-linux-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with: { version: 9 }

      - name: Install Node
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with: { python-version: "3.13" }

      - name: Install Python deps
        shell: bash
        run: |
          unset VIRTUAL_ENV
          uv venv .venv --python 3.13 --allow-existing
          uv pip install -e . pyinstaller huggingface_hub --python .venv/bin/python || \
          uv pip install -e . pyinstaller huggingface_hub --python .venv/Scripts/python.exe

      - name: Build sidecar
        shell: bash
        run: |
          PY=.venv/bin/python; [ -f .venv/Scripts/python.exe ] && PY=.venv/Scripts/python.exe
          "$PY" packaging/build_sidecar.py

      - name: Install Tauri dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # tag 推送才创建/上传 Release；main 推送只构建不出版
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p bundle-out
          find src-tauri/target/release/bundle -type f \
            \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" \
               -o -name "*.sig" -o -name "*.app.tar.gz" \) -exec cp {} bundle-out/ \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: bundle-out/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Refresh latest release (main push)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest --prerelease \
            --title "Latest (main @ ${{ github.sha }})" \
            --notes "自动构建于 commit ${{ github.sha }}" \
            dist/*

      - name: Attach binaries to versioned release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" --title "$tag" --generate-notes dist/*
          fi
