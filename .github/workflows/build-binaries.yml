name: build-binaries

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: chalkpress-macos-arm64
            sep: ":"
            py: .venv/bin/python
            archive: zip
          - os: windows-latest
            artifact: chalkpress-windows-x64
            sep: ";"
            py: .venv/Scripts/python.exe
            archive: zip
          - os: ubuntu-22.04
            artifact: chalkpress-linux-x64
            sep: ":"
            py: .venv/bin/python
            archive: tar

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: bash
        run: |
          unset VIRTUAL_ENV
          uv venv .venv --python 3.13 --allow-existing
          uv pip install -e . pyinstaller --python "${{ matrix.py }}"

      - name: Materialize whisper-small model
        shell: bash
        run: |
          uv pip install huggingface_hub --python "${{ matrix.py }}"
          "${{ matrix.py }}" -c "from huggingface_hub import snapshot_download; snapshot_download('Systran/faster-whisper-small', local_dir='build/model')"

      - name: Build with PyInstaller
        shell: bash
        run: >
          "${{ matrix.py }}" -m PyInstaller --noconfirm --windowed --name chalkpress
          --collect-all faster_whisper --collect-all ctranslate2
          --collect-all imageio_ffmpeg --collect-all onnxruntime
          --collect-all tokenizers --collect-all av
          --add-data "build/model${{ matrix.sep }}models/faster-whisper-small"
          run_gui.py

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path chalkpress -DestinationPath ${{ matrix.artifact }}.zip -Force"
          else
            find . -maxdepth 1 \( -name "chalkpress.app" -o -name "chalkpress" \) | xargs zip -qry ${{ matrix.artifact }}.zip
          fi

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          cd dist
          tar czf ${{ matrix.artifact }}.tar.gz chalkpress

      - name: Create dmg
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname chalkpress -srcfolder dist/chalkpress.app -ov -format UDZO dist/${{ matrix.artifact }}.dmg

      - name: Build installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION=$("${{ matrix.py }}" -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "AppVersion=$VERSION"
          MSYS_NO_PATHCONV=1 "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" /DAppVersion="$VERSION" packaging/chalkpress.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Refresh latest release (main push)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest --prerelease \
            --title "Latest (main @ ${{ github.sha }})" \
            --notes "自动构建于 commit ${{ github.sha }}" \
            dist/*

      - name: Attach binaries to versioned release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" --title "$tag" --generate-notes dist/*
          fi
