[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chalkpress"
version = "0.3.0"
description = "Chalkpress：讲座视频 → 讲义 PDF（关键帧 + 字幕 + AI 总结），跨平台 CLI 与 GUI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
  "pillow>=10",
  "reportlab>=4",
  "requests>=2.28",
  "opencc-python-reimplemented>=0.1.7",
  "imageio-ffmpeg>=0.4.9",
  "faster-whisper>=1.0",
]

[project.optional-dependencies]
mac = ["mlx-whisper>=0.5"]

[project.scripts]
chalkpress = "chalkpress.cli:main"

[tool.setuptools]
packages = ["chalkpress"]
