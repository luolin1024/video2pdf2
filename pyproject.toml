[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video2pdf2"
version = "0.1.0"
description = "mp4 → 关键帧 PDF + 关键字幕 + LLM 分析总结（跨平台 CLI；GUI 与打包可执行程序在路线图）"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pillow>=10",
  "reportlab>=4",
  "requests>=2.28",
  "opencc-python-reimplemented>=0.1.7",
  "imageio-ffmpeg>=0.4.9",
  "faster-whisper>=1.0",
]

[project.optional-dependencies]
mac = ["mlx-whisper>=0.5"]

[project.scripts]
v2p2 = "v2p2.cli:main"
v2p2-gui = "v2p2.gui:main"

[tool.setuptools]
packages = ["v2p2"]
